name: Deploy

# Continuous deployment: runs only after CI succeeded on main.
# Order: backend (Render deploy hook) -> production smoke test.
# The frontend is deployed by Vercel's Git integration on each push to main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  API_URL: https://agentflow-api-3tu5.onrender.com
  WEB_URL: https://agentflow-alpha-azure.vercel.app
  COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  backend:
    name: Backend (Render)
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Secret RENDER_DEPLOY_HOOK_URL is missing (see docs/DEPLOY.md, section CD)."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
          echo "Render deploy started for $COMMIT."

  smoke:
    name: Production smoke test
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for the new backend, run a real task, check the frontend
        run: python scripts/smoke_test.py --api "$API_URL" --web "$WEB_URL" --commit "$COMMIT"
